<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    rect.outer {
      fill: none;
      stroke: #0a0b0e;
      stroke-width: 8;
    }
    rect.inner {
      fill: #0a0b0e;
    }
    @media (prefers-color-scheme: dark) {
      rect.outer {
        stroke: #ffffff;
      }
      rect.inner {
        fill: #ffffff;
      }
    }
  </style>
  <rect class="outer" x="15" y="15" width="70" height="70" />
  <rect class="inner" x="40" y="40" width="20" height="20" />
</svg>